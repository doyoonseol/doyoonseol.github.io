name: Deploy to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages on every
# push to main. Also runnable on demand from the Actions tab.
#
# ONE-TIME MANUAL SETUP (this workflow cannot do it for you):
#   Repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until that is set, this workflow builds successfully but publishes nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publish to Pages
  id-token: write # OIDC token the deploy step requires

# Let an in-flight deploy finish rather than cancelling it. Cancelling a
# half-published Pages deployment can leave the live site inconsistent.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Photo derivatives are committed directly today. If they are ever
          # moved to Git LFS, set this to true or the build will bundle
          # pointer files instead of images.
          lfs: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # `npm ci` installs strictly from the lockfile, so CI can never silently
      # resolve a different dependency tree than local development.
      - name: Install dependencies
        run: npm ci

      # Renditions are expensive to encode and deterministic, so they are cached
      # across runs. The key changes whenever photos/ changes, and `restore-keys`
      # falls back to the most recent previous cache — so adding one photograph
      # re-encodes that one photograph, not the whole archive.
      - name: Restore photo renditions
        uses: actions/cache@v6
        with:
          path: |
            public/img
            .photo-cache.json
          key: photos-${{ hashFiles('photos/**') }}
          restore-keys: |
            photos-

      # Run explicitly, rather than relying on the npm pre-step in `typecheck` and
      # `build`, so that the photo log and any alt-text warnings are easy to find.
      - name: Build photo renditions
        run: npm run photos

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify export is valid for Pages
        run: npm run verify:export

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
