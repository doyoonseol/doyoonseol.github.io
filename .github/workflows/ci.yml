name: CI

# Runs the same checks as the deploy workflow but publishes nothing, so a
# pull request that would break the live site fails before it is merged.
#
# Deliberately does not reuse deploy.yml: this job needs no Pages permissions
# and no OIDC token, and it should stay that way.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore photo renditions
        uses: actions/cache@v6
        with:
          path: |
            public/img
            .photo-cache.json
          key: photos-${{ hashFiles('photos/**') }}
          restore-keys: |
            photos-

      - name: Build photo renditions
        run: npm run photos

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify export is valid for Pages
        run: npm run verify:export
