<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-label="Placeholder frame 05, unprocessed">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(77 0.5 0.5)">
      <stop offset="0%" stop-color="rgb(83,92,82)"/>
      <stop offset="100%" stop-color="rgb(116,126,116)"/>
    </linearGradient>
    <radialGradient id="v" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="rgb(0,0,0)" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgb(0,0,0)" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <!-- No feTurbulence grain here on purpose. Rasterising a fractal-noise filter
       across a 3000px canvas, eight times over, makes scrolling feel sluggish —
       which would give a false impression of the site's real performance, since
       actual photographs cost nothing to composite. -->
  <rect width="3840" height="2160" fill="url(#g)"/>
  <rect width="3840" height="2160" fill="url(#v)"/>

  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'EB Garamond', serif"
        font-size="432"
        fill="rgb(255,255,255)" fill-opacity="0.14">05</text>

  <text x="50%" y="2041" text-anchor="middle"
        font-family="Georgia, 'EB Garamond', serif"
        font-size="69"
        letter-spacing="13"
        fill="rgb(255,255,255)" fill-opacity="0.42">PLACEHOLDER 05 — RAW</text>
</svg>
