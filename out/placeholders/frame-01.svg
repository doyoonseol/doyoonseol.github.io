<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2000" viewBox="0 0 3000 2000" role="img" aria-label="Placeholder frame 01">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(25 0.5 0.5)">
      <stop offset="0%" stop-color="rgb(42,38,34)"/>
      <stop offset="100%" stop-color="rgb(92,84,74)"/>
    </linearGradient>
    <radialGradient id="v" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="rgb(0,0,0)" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgb(0,0,0)" stop-opacity="0.34"/>
    </radialGradient>
  </defs>

  <!-- No feTurbulence grain here on purpose. Rasterising a fractal-noise filter
       across a 3000px canvas, eight times over, makes scrolling feel sluggish —
       which would give a false impression of the site's real performance, since
       actual photographs cost nothing to composite. -->
  <rect width="3000" height="2000" fill="url(#g)"/>
  <rect width="3000" height="2000" fill="url(#v)"/>

  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'EB Garamond', serif"
        font-size="400"
        fill="rgb(255,255,255)" fill-opacity="0.2">01</text>

  <text x="50%" y="1890" text-anchor="middle"
        font-family="Georgia, 'EB Garamond', serif"
        font-size="64"
        letter-spacing="12"
        fill="rgb(255,255,255)" fill-opacity="0.42">PLACEHOLDER 3000×2000</text>
</svg>
