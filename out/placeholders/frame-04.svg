<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2400" viewBox="0 0 2400 2400" role="img" aria-label="Placeholder frame 04">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(64 0.5 0.5)">
      <stop offset="0%" stop-color="rgb(36,36,33)"/>
      <stop offset="100%" stop-color="rgb(140,132,120)"/>
    </linearGradient>
    <radialGradient id="v" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="rgb(0,0,0)" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgb(0,0,0)" stop-opacity="0.34"/>
    </radialGradient>
  </defs>

  <!-- No feTurbulence grain here on purpose. Rasterising a fractal-noise filter
       across a 3000px canvas, eight times over, makes scrolling feel sluggish —
       which would give a false impression of the site's real performance, since
       actual photographs cost nothing to composite. -->
  <rect width="2400" height="2400" fill="url(#g)"/>
  <rect width="2400" height="2400" fill="url(#v)"/>

  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'EB Garamond', serif"
        font-size="480"
        fill="rgb(255,255,255)" fill-opacity="0.2">04</text>

  <text x="50%" y="2268" text-anchor="middle"
        font-family="Georgia, 'EB Garamond', serif"
        font-size="77"
        letter-spacing="14"
        fill="rgb(255,255,255)" fill-opacity="0.42">PLACEHOLDER 2400×2400</text>
</svg>
